<style>
:root {

/* 繝翫ン */

.nav-inner{max-width:var(--max-width);margin:0 auto;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}

.nav-cta:hover{background:var(--color-blue-accent);border-color:var(--color-blue-accent)}
@media(max-width:900px){
  .nav-links{display:none}

  .nav-logo .sub,.nav-logo .divider{display:none}
}

/* 繝偵・繝ｭ繝ｼ */
.hero{padding:160px 32px 100px;max-width:var(--max-width);margin:0 auto;position:relative}
.hero-tag{font-family:var(--font-en);font-size:12px;letter-spacing:0.3em;color:var(--color-blue-accent);text-transform:uppercase;font-weight:600;margin-bottom:36px;opacity:0;animation:fadeUp 0.8s ease forwards;display:inline-flex;align-items:center;gap:14px}

.hero-title{font-family:var(--font-display);font-weight:900;font-size:clamp(36px,5.5vw,72px);line-height:1.25;letter-spacing:0.02em;margin-bottom:32px;color:var(--color-navy);opacity:0;animation:fadeUp 0.8s ease 0.15s forwards}
.hero-title .accent{color:var(--color-blue-accent)}

.hero-cta-group{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fadeUp 0.8s ease 0.5s forwards}
.btn-primary{display:inline-flex;align-items:center;gap:12px;padding:18px 36px;background:var(--color-navy);color:var(--color-bg-pure);font-size:14px;font-weight:600;letter-spacing:0.1em;border-radius:2px;transition:all 0.3s;border:1px solid var(--color-navy)}
.btn-primary:hover{background:var(--color-blue-accent);border-color:var(--color-blue-accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,78,216,0.25)}
.btn-primary::after{content:'竊・;transition:transform 0.3s;font-family:var(--font-en)}
.btn-primary:hover::after{transform:translateX(4px)}
.btn-secondary{display:inline-flex;align-items:center;gap:12px;padding:18px 36px;border:1px solid var(--color-navy);color:var(--color-navy);font-size:14px;letter-spacing:0.1em;font-weight:600;border-radius:2px;transition:all 0.3s}
.btn-secondary:hover{background:var(--color-navy);color:var(--color-bg-pure)}
.hero-mark{position:absolute;top:170px;right:32px;text-align:right;opacity:0;animation:fadeUp 1s ease 0.6s forwards}
.hero-mark-num{font-family:var(--font-en);font-size:clamp(56px,7vw,96px);font-weight:700;color:var(--color-navy);line-height:1;letter-spacing:-0.04em;margin-bottom:4px}
.hero-mark-num .plus{color:var(--color-blue-accent);font-size:0.55em;vertical-align:top;margin-left:4px}
.hero-mark-label{font-size:11px;letter-spacing:0.2em;font-family:var(--font-en);color:var(--color-ink-mute);text-transform:uppercase;font-weight:500}
@media(max-width:900px){
  .hero{padding:130px 20px 70px}
  .hero-mark{display:none}
  .hero-sub br{display:none}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
